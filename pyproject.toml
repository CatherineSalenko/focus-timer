[project]
name = "focus-timer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CatherineSalenko", email = "salenko.catherine@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
focus-timer = "focus_timer:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
